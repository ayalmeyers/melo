name: Catalog
# Fetches real artwork for the starting catalog plus Apple's current charts, and commits the result.
on:
  workflow_dispatch:
  schedule: [{ cron: '17 9 * * 1' }]   # Mondays: refresh the charts
  push:
    branches: [main]
    paths: [scripts/build-catalog.mts, scripts/gen-seed.mjs, .github/workflows/catalog.yml, packages/core/src/catalog-data.js, packages/core/src/images.ts, packages/core/src/apple.ts]
permissions: { contents: write }
concurrency: { group: catalog, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Match artwork, pull charts, find artist photos
        run: npx --yes tsx@4.19.2 scripts/build-catalog.mts
      # The build takes a while; main may have moved. Start from the newest main, keep only the freshly built catalog, then regenerate.
      - name: Rebase onto the newest main
        run: |
          cp packages/core/src/catalog-art.js catalog-report.md /tmp/
          git fetch origin main && git reset --hard origin/main
          cp /tmp/catalog-art.js packages/core/src/catalog-art.js && cp /tmp/catalog-report.md catalog-report.md
      - name: Regenerate seed and database update
        run: npm run seed
      - name: Commit
        run: |
          git config user.name "melo-catalog-bot"
          git config user.email "melo-catalog-bot@users.noreply.github.com"
          git add packages/core/src/catalog-art.js catalog-report.md supabase/seed.sql supabase/setup.sql supabase/updates
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Catalog: real artwork and current charts"
          git push origin HEAD:main
