name: Library
# Fills Melo's music library in Supabase: artists, full discographies with covers, photos and bios.
# Needs repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY. Resumable; each run continues where the last stopped.
on:
  workflow_dispatch:
    inputs:
      min_sitelinks: { description: 'Include artists with at least this many Wikipedia language editions', default: '12' }
      limit: { description: 'Stop after this many artists (0 = no limit)', default: '0' }
  schedule: [{ cron: '41 */6 * * *' }]
  push:
    branches: [main]
    paths: [scripts/library.mts, scripts/genres.mts, .github/workflows/library.yml]
permissions: { contents: read }
concurrency: { group: library, cancel-in-progress: true }   # runs are resumable, so the newest code wins
jobs:
  fill:
    # Four runners, four Apple rate limits: each takes every fourth artist.
    strategy: { fail-fast: false, matrix: { shard: [0, 1, 2, 3] } }
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fill the library
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIB_MIN_SITELINKS: ${{ inputs.min_sitelinks || '12' }}
          LIB_LIMIT: ${{ inputs.limit || '0' }}
          LIB_MAX_MINUTES: '320'
          LIB_SHARD: ${{ matrix.shard }}
          LIB_SHARDS: '4'
        run: npx --yes tsx@4.19.2 scripts/library.mts
