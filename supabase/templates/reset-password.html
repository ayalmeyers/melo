<!-- Supabase → Authentication → Emails → Reset password. Subject: Reset your Melo password -->
<div style="font-family:Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#14161c">
  <p style="font-size:28px;font-weight:800;margin:0 0 24px">melo<span style="color:#047eef">.</span></p>
  <h1 style="font-size:22px;margin:0 0 12px">Reset your password</h1>
  <p style="font-size:16px;line-height:1.5;margin:0 0 24px">Tap the button to choose a new password. The link works once and expires in an hour.</p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset" style="display:inline-block;background:#047eef;color:#fff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:14px">Choose a new password</a>
  <p style="font-size:13px;color:#8a90a0;margin:28px 0 0">If you didn't ask for this, ignore this email; your password stays the same.</p>
</div>
